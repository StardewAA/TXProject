server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Enterprise licences are JSON data URLs. Base64 encoding increases the
    # payload by about one third, so a valid 1 MB image exceeds nginx's 1 MB
    # default request limit before it can reach the application.
    client_max_body_size 4m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /app-api/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header tenant-id $http_tenant_id;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
