spring:
  application:
    name: cms-server
  profiles:
    active: local
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  sql:
    init:
      mode: never # 骨架阶段不初始化或修改数据库
  data:
    redis:
      repositories:
        enabled: false
  cloud:
    nacos:
      discovery:
        enabled: ${CMS_NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        enabled: false
        import-check:
          enabled: false

server:
  port: ${CMS_SERVER_PORT:48100}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.iocoder.txgy.module.cms.dal.dataobject
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

xxl:
  job:
    enabled: false # 尚未实现同步任务，不启动执行器

txgy:
  info:
    version: 1.0.0
    base-package: cn.iocoder.txgy.module.cms
  web:
    admin-ui:
      url: ${CMS_ADMIN_UI_URL:http://localhost:5666}
  swagger:
    title: 行业法律法规及劳动法检索
    description: CMS 法规检索模块骨架，业务接口待实现
    version: ${txgy.info.version}
  tenant:
    enable: true
  search:
    redis:
      enabled: false # 仅配置绑定和接口契约；实现完成前不要开启
      host: ${TXGY_SEARCH_REDIS_HOST:127.0.0.1}
      port: ${TXGY_SEARCH_REDIS_PORT:6380}
      username: ${TXGY_SEARCH_REDIS_USERNAME:}
      password: ${TXGY_SEARCH_REDIS_PASSWORD:}
      ssl: ${TXGY_SEARCH_REDIS_SSL:false}
      timeout-millis: 3000
      index-prefix: txgy:cms:law
