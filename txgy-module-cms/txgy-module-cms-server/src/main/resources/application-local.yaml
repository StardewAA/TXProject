# 复用现有业务数据库；不创建新数据库，不硬编码账号或密码。
# 启动前提供 TXGY_DB_USERNAME 和 TXGY_DB_PASSWORD。
spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${TXGY_DB_HOST:127.0.0.1}:${TXGY_DB_PORT:3307}/${TXGY_DB_NAME:ruoyi-vue-pro}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
          username: ${TXGY_DB_USERNAME}
          password: ${TXGY_DB_PASSWORD}
  data:
    redis:
      host: ${TXGY_CACHE_REDIS_HOST:127.0.0.1}
      port: ${TXGY_CACHE_REDIS_PORT:6379}
      database: ${TXGY_CACHE_REDIS_DATABASE:0}
      password: ${TXGY_CACHE_REDIS_PASSWORD:}
