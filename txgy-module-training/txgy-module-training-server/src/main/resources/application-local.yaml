spring:
  cloud:
    discovery: # 【本地无 Nacos】静态服务实例，让 Feign / LoadBalancer 直接找到本地启动的服务
      client:
        simple:
          instances:
            system-server: # 本地启动的 system-server
              - uri: http://127.0.0.1:48081
            training-server: # 本地启动的 training-server
              - uri: http://127.0.0.1:48094
    nacos:
      server-addr: 127.0.0.1:8848
      username:
      password:
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
      config:
        namespace: dev
        group: DEFAULT_GROUP

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'

txgy:
  env:
    tag: ${HOSTNAME}
  security:
    mock-enable: true
  access-log:
    enable: false

--- #################### 数据库相关配置（本地开发，Docker MySQL 映射 3307） ####################

spring:
  datasource:
    dynamic:
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 20
        max-wait: 60000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
      primary: master
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3307/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456
        slave:
          lazy: true
          url: jdbc:mysql://127.0.0.1:3307/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
          username: root
          password: 123456

  # Redis 配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
