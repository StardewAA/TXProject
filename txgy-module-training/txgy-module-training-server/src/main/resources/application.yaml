spring:
  application:
    name: training-server
  profiles:
    active: local
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  # 资源中心大文件上传（视频 ≤500MB）
  servlet:
    multipart:
      max-file-size: 4300MB
      max-request-size: 4300MB
      # 上传临时文件随请求结束自动清理；大文件分片落盘避免占用内存
      file-size-threshold: 10MB

server:
  port: 48094
  tomcat:
    # 超限上传时允许 Tomcat 完整消费请求体并返回友好错误 JSON，避免直接断连
    max-swallow-size: -1

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

txgy:
  info:
    version: 1.0.0
    base-package: cn.iocoder.txgy.module.training
  web:
    admin-ui:
      url: http://localhost:5173
  swagger:
    title: 云培训学院
    description: 云培训学院管理后台接口
    version: ${txgy.info.version}
  tenant:
    enable: true
    ignore-urls:
      - /admin-api/training/live-media/hook
      - /admin-api/training/live-media/authorize
      - /training/live-media/hook
      - /training/live-media/authorize
      - /training/document/preview
      - /training/video/play
      # 模块九：证书公开验真免登录接口（公共 H5 无租户头，两种前缀写法都注册以防框架差异）
      - /training/analytics/cert-verify/public
      - /admin-api/training/analytics/cert-verify/public
  # 资源中心本地文件存储根目录（容器内通过 RESOURCE_UPLOAD_DIR=/app/uploads 覆盖）
  resource:
    upload-dir: ${RESOURCE_UPLOAD_DIR:./uploads}

# AI 大模型（考试题库：文档导入自动提取试题）
# 支持任意 OpenAI 兼容接口：DeepSeek / 豆包（火山方舟）/ 通义 / 月之暗面 等
# 未配置 api-key 时自动降级为本地规则解析，不影响功能可用性
training:
  ai:
    enabled: ${TRAINING_AI_ENABLED:false}
    provider: ${TRAINING_AI_PROVIDER:deepseek}
    base-url: ${TRAINING_AI_BASE_URL:https://api.deepseek.com}
    chat-path: ${TRAINING_AI_CHAT_PATH:/chat/completions}
    api-key: ${TRAINING_AI_API_KEY:}
    model: ${TRAINING_AI_MODEL:deepseek-chat}
    timeout-ms: ${TRAINING_AI_TIMEOUT_MS:60000}
    max-text-length: ${TRAINING_AI_MAX_TEXT_LENGTH:12000}
    max-questions: ${TRAINING_AI_MAX_QUESTIONS:30}
  # 视频转码：异步上传成功后由后台线程池调用 ffmpeg 生成多清晰度（默认 360P/480P/720P）
  # 运行环境需安装 ffmpeg（镜像内已内置，也可通过 ffmpeg-path 指定自定义路径）
  video:
    transcode:
      enabled: ${TRAINING_VIDEO_TRANSCODE_ENABLED:true}
      ffmpeg-path: ${TRAINING_VIDEO_TRANSCODE_FFMPEG_PATH:ffmpeg}
      target-definitions: ${TRAINING_VIDEO_TRANSCODE_TARGETS:360P,480P,720P}
      pool-size: ${TRAINING_VIDEO_TRANSCODE_POOL_SIZE:2}
      timeout-minutes: ${TRAINING_VIDEO_TRANSCODE_TIMEOUT_MINUTES:180}
      output-dir: video/transcode
      max-retry: 1
      preset: veryfast

debug: false
