spring:
  application:
    name: training-server
  profiles:
    active: local
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml
  # 资源中心大文件上传（视频 ≤500MB）
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: 48094

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

txgy:
  info:
    version: 1.0.0
    base-package: cn.iocoder.txgy.module.training
  web:
    admin-ui:
      url: http://localhost:5173
  swagger:
    title: 云培训学院
    description: 云培训学院管理后台接口
    version: ${txgy.info.version}
  tenant:
    enable: true
    ignore-urls:
      - /training/document/preview
      - /training/video/play
      # 模块九：证书公开验真免登录接口（公共 H5 无租户头，两种前缀写法都注册以防框架差异）
      - /training/analytics/cert-verify/public
      - /admin-api/training/analytics/cert-verify/public
  # 资源中心本地文件存储根目录（容器内通过 RESOURCE_UPLOAD_DIR=/app/uploads 覆盖）
  resource:
    upload-dir: ${RESOURCE_UPLOAD_DIR:./uploads}

debug: false
