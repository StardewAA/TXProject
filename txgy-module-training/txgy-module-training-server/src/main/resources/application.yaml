spring:
  application:
    name: training-server
  profiles:
    active: local
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml

server:
  port: 48094

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

txgy:
  info:
    version: 1.0.0
    base-package: cn.iocoder.txgy.module.training
  web:
    admin-ui:
      url: http://localhost:5173
  swagger:
    title: 云培训学院
    description: 云培训学院管理后台接口
    version: ${txgy.info.version}
  tenant:
    enable: true
    ignore-urls:

debug: false
