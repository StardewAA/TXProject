spring:
  application:
    name: bidding-server

  profiles:
    active: local

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
    allow-bean-definition-overriding: true # 允许 Bean 覆盖，例如说 Feign 等会存在重复定义的服务

  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # 加载【本地】配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置

  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 16MB # 单个文件大小
      max-request-size: 32MB # 设置总上传的文件大小

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 设置过期时间为 1 小时

server:
  port: 48110

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true # 1. 是否开启 Swagger 接文档的元数据
    path: /v3/api-docs
  swagger-ui:
    enabled: true # 2.1 是否开启 Swagger 文档的官方 UI 界面
    path: /swagger-ui
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档

knife4j:
  enable: true
  setting:
    language: zh_cn

# MyBatis Plus 的配置项
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
  global-config:
    db-config:
      id-type: NONE # "智能"模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${txgy.info.base-package}.dal.dataobject
  encryptor:
    password: XDV71a+xqStEA3WH # 加解密的秘钥，可使用 https://www.imaegoo.com/2020/aes-key-generator/ 网站生成

mybatis-plus-join:
  banner: false # 关闭控制台的 Banner 打印

# Spring Data Redis 配置
spring:
  data:
    redis:
      repositories:
        enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度

# VO 转换（数据翻译）相关
easy-trans:
  is-enable-global: false # 【默认禁用，对性能确认压力大】启用全局翻译（拦截所有 SpringMVC ResponseBody 进行自动翻译 )。如果对于性能要求很高可关闭此配置，或通过 @IgnoreTrans 忽略某个接口

--- #################### MQ 消息队列相关配置 ####################

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    executor:
      appname: ${spring.application.name} # 执行器 AppName
      logpath: ${user.home}/logs/xxl-job/${spring.application.name} # 执行器运行日志文件存储磁盘路径
    accessToken: default_token # 执行器通讯TOKEN

--- #################### OPENLAB BS相关配置 ####################

txgy:
  info:
    version: 1.0.0
    base-package: cn.iocoder.txgy.module.bidding
  web:
    admin-ui:
      url: http://dashboard.txgy.iocoder.cn # Admin 管理后台 UI 的地址
  xss:
    enable: false
    exclude-urls: # 如下 url，仅仅是为了演示，去掉配置也没关系
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  swagger:
    title: 管理后台
    description: 提供管理员管理的所有功能
    version: ${txgy.info.version}
  tenant: # 多租户相关配置项
    enable: true
    ignore-urls:

# 检索组件（notice 全文检索，规范 4.6）：es 开关放根级 bidding: 下，与 EsNoticeSearchEngine 的
# @ConditionalOnProperty(prefix=bidding.es) / @Value(bidding.es.uris) 读取键一致
# enabled=true 启用 ES 引擎（原生 HTTP，失败重试 3 次，索引 bidding-notice / bidding-notice-external）；无集群时置 false 走数据库兜底
bidding:
  crawl:
    # 下载器 HTTP 客户端参数（配置文件为准；HttpFetchClient 启动时 @ConfigurationProperties 读取）
    # connect/second 连接超时（秒）；read/second 单请求读超时（秒）；followRedirects 是否跟随重定向（默认 NORMAL）
      # userAgent 默认走浏览器 UA；referer 可选注入；downloadTimeoutSeconds PDF/附件下载超时（秒）
      # 2026-09-10 新增（下载监控与数据完整性，见 docs/开发联调与运维/爬虫测试与监控指标-2026-09-10.md）：
      #   max-download-bytes 单文件下载上限（防跑飞/防被灌大文件撑爆内存，超限即失败并审计）
      #   speed-warn-bps 下载速率上限告警（超过=带宽异常/被镜像加速，记 WARN 并落审计）
      #   speed-slow-warn-bps 速率下限告警（长期低于=被限速/站点异常，记 WARN 并落审计）
      #   robots-enabled 是否遵循 robots.txt（true=抓取前检查 Disallow；robots.txt 不可达时放行并记审计）
      #   robots-cache-minutes robots.txt 缓存时长（分钟，默认 360）
    http:
      connect-timeout-seconds: 10
      read-timeout-seconds: 20
      download-timeout-seconds: 60
      max-download-bytes: 52428800
      speed-warn-bps: 2097152
      speed-slow-warn-bps: 2048
      robots-enabled: true
      robots-cache-minutes: 360
      follow-redirects: true
      user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36
      # 下载目标临时目录（存 PDF 二进制后做 PDFBox 解析；空=java.io.tmpdir）
      download-tmp-dir: ./data/crawl-tmp
    # ============ 爬取频率（唯一事实源：改本文件即生效，无需改代码） ============
    # 业务要求（2026-09-09 用户口径）：安全、稳，演示节奏像正常业务；慢是要求，不是缺陷
    runner:
      # 【2026-09-10 语义变更】下载「公告原文文件」的最小间隔（毫秒），当前 5 分钟=300000。
      # 生效位置：CrawlDownloadGate（库内原子占位，表 bidding_crawl_download_gate）——在真正发起原文下载**之前**占位，
      #   而不是在"任务被调度"时。因此：纯本地处理任务（列表已带全文，无网络下载）不消耗间隔；
      #   进程重启、多实例部署都不会放宽速率（原实现是进程内变量，重启即归零、多实例各算一份）。
      # 实际间隔 = max(本值, 源 fetch_interval_seconds×1000)，且不低于合规下限 120 秒。
      # 2026-09-10 用户口径调整：由 5 分钟缩短为 2 分钟（120000ms）——2 分钟即合规下限，
      # 故 CrawlDownloadGate 的 MIN_INTERVAL_SECONDS=120 与之对齐；再调小将不生效（下限保护）。
      consumer-delay-ms: 120000
      # 生产端翻页间隔：多页回溯每页之间等 1 分钟再翻下一页
      page-delay-ms: 60000
      # 页内条目处理间隔（列表已整页取回后的本地处理节拍，随主节奏保持低频观感）
      entry-delay-ms: 1500
      # 异步投递模式（审查 A1）：true=列表只入队，原文下载由消费端按限速闸逐条执行（**推荐的合规形态**）；
      # false=同步直抓：GX 详情页/PDF 会在列表循环内下载，自 2026-09-10 起该路径同样先过限速闸并阻塞等待，
      #   不再出现"一有任务就直接下载"，但会让单轮采集耗时 = 条数 × 间隔，仅建议小规模人工验证时使用。
      async-mode: true
      # 首次全量窗口（天）：源从无 SUCCESS 历史（首次爬取无断点）时回溯补历史的天数；栏目级 fullLookbackDays 可覆盖
      full-lookback-days: 60
      # 首次全量单栏目单轮页上限（防失控；停页由窗口外判定负责）
      full-max-pages: 300
    # 定时调度（CrawlRunServiceImpl @Value 读取；默认开：30s tick 按各源 fetch_interval_seconds ≥120 节流触发 SCHEDULE 轮次）
    scheduler:
      enabled: true
  es:
    # enabled=true：装配 ES 检索引擎与索引通知器，且 EsStartupHealthCheck 启动强制探活（ES 不可达=拒绝启动，防无索引上线）；
    # 确需无 ES 降级运行（检索报"未启用"、不建索引）才显式置 false
    enabled: true
    uris: http://127.0.0.1:9200
    debug: true # ES 请求/响应调试日志（本地联调开 true；生产置 false）。ESDebug 开关即本键
    username: ${ES_USERNAME:elastic} # 账号（本地 dev，勿提交生产凭据）
    password: ${ES_PASSWORD:} # 密码：本地用环境变量 ES_PASSWORD 注入（不入库）；留空=不带认证
  ai:
    # AI 结构化抽取（PDF/HTML 公告 → 结构化字段 + 扫描件全文转写；规范依据：设计 v0.6 §7 增强）
    # enabled=false → /notice-external/ai-extract 报"未配置"；true 走下方 base-url 指向的 AI 模块入口
    enabled: true
    # AI 模块 admin-api 入口：默认走网关 48080（容器化 ai-server 未映射端口，经网关转发可达且路由已验证）；
    # 本地另起 ai-server(48086) 时可改指 http://127.0.0.1:48086/admin-api
    base-url: http://127.0.0.1:48080/admin-api
    conversation-id: # 固定复用会话 id（空则每次自动 create-my）
    # ai-server 启用真实鉴权时注入真 token；本地 mock-enable 联调默认 test1（mockSecret 前缀）
    admin-token: ${BIDDING_AI_ADMIN_TOKEN:test1}
    # AI 调用租户兜底值（默认平台租户 1）：正常跟随当前请求/触发者租户（各租户用自己的
    # AI 渠道与 key，见 AiChatNoticeExtractor.resolveTenantId）；仅离线/无租户上下文时用此兜底
    tenant-id: 1
    timeout-seconds: 60
    # 公告 AI 解析角色 id（2026-09-09：role 20=公告AI解析 / deepseek-chat / test key；建会话自动带该角色 System Message=解析提示词）
    role-id: 20
    # 温度（低=稳/贴 JSON，高=发散；抽取建议 0~0.5）
    temperature: 0.3
    # 单条回复最大 token
    max-tokens: 4096
  ext-notice:
    pdf:
      open-data-loader:
        # OpenDataLoader 本地引擎（PDFBox 实现）：extract(File)→text/tables/pageCount，见 infra.file.PdfBoxOpenDataLoader
        loader-class: cn.iocoder.txgy.module.bidding.infra.file.PdfBoxOpenDataLoader

