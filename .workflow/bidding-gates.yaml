version: '1.0'
name: bidding-gates
displayName: 招投标门禁（10 项 SQL/前端一致性自检）

# 说明：Gitee Go 流水线定义。脚本零依赖（只用 Node 内置模块），无需 npm install。
# 语法依据：https://help.gitee.com/gitee-go/pipeline/trigger（触发段）、
#   Gitee Go 示例流水线（stage/steps 与 nodeVersion 取值）。
# nodeVersion 仅支持 8.16.2 / 10.17.0 / 12.16.1 / 14.16.0 / 15.12.0，门禁脚本兼容 Node 14。
# 本地等价命令：cd txgy-module-bidding && node sql/tools/check-all.js
triggers:
  push:
    branches:
      include:
        - '*'
        - 'feat/*'
  pr:
    branches:
      include:
        - '*'

stages:
  - stage:
    name: gates
    displayName: 门禁
    steps:
      - step: build@nodejs
        name: gates
        displayName: 运行 10 项自检
        nodeVersion: 14.16.0
        commands:
          - node --version
          - node txgy-module-bidding/sql/tools/check-all.js
