    pull_policy: never
  product:
    image: txgy-product:cross-tenant-20260925
    pull_policy: never
  mall-pc:
    image: txgy-mall-pc:cross-tenant-20260925
    pull_policy: never
  mall-h5:
    image: txgy-mall-h5:cross-tenant-20260925
    pull_policy: never
