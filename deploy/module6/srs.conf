listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;
http_api { enabled on; listen 1985; }
http_server { enabled on; listen 8080; dir ./objs/nginx/html; }
vhost __defaultVhost__ {
    hls {
        enabled on;
        hls_fragment 2;
        hls_window 10;
        hls_path ./objs/nginx/html;
    }
    dvr {
        enabled on;
        dvr_plan session;
        dvr_path ./objs/nginx/html/recordings/[stream].mp4;
    }
    http_hooks {
        enabled on;
        on_publish http://training:48080/admin-api/training/live-media/hook?secret=HOOK_SECRET;
        on_unpublish http://training:48080/admin-api/training/live-media/hook?secret=HOOK_SECRET;
        on_dvr http://training:48080/admin-api/training/live-media/hook?secret=HOOK_SECRET;
    }
}
