server {
    listen 80;
    server_name _;
    client_max_body_size 4g;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    # Docker 内嵌 DNS：动态解析上游，避免容器重启换 IP 后 nginx 缓存旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:48080;

    # 前端未携带租户头时使用商城默认租户 1；显式传入的租户编号保持不变。
    # 这里采用 server/location 变量而不是依赖未加载的 nginx-main.conf，
    # 确保按当前 Dockerfile 直接构建时也能正常启动。
    set $resolved_tenant_id $http_tenant_id;
    if ($resolved_tenant_id = "") {
        set $resolved_tenant_id 1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /admin-api/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;            # SSE (AI send-stream) needs unbuffered responses
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header tenant-id $resolved_tenant_id;
    }

    location /app-api/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header tenant-id $resolved_tenant_id;
    }

    location /admin/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 云培训学院-考试与认证（training-exam 独立服务）
    location /training-exam/ {
        resolver 127.0.0.11 valid=30s;
        set $exam_upstream http://training-exam:8000;
        rewrite ^/training-exam/(.*)$ /$1 break;
        proxy_pass $exam_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header tenant-id $http_tenant_id;
        proxy_read_timeout 60s;
    }

    # 云培训学院-直播（SRS 媒体，鉴权后转发）
    location /live-media/ {
        # live-srs 是可选服务。使用变量延迟解析上游，避免该服务未
        # 启动时 nginx 在启动阶段因 DNS 解析失败而整体退出。
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $live_media_upstream_v2 http://live-srs:8080;
        auth_request /_live_authorize;
        proxy_pass $live_media_upstream_v2/;
        add_header Cache-Control "private, no-store";
    }
    location = /_live_authorize {
        internal;
        # training 同样不是基础商城启动必需服务，延迟解析其地址。
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $training_upstream http://training:48080;
        proxy_pass $training_upstream/admin-api/training/live-media/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location /infra/ws {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jmreport/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /drag/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jimubi/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sse {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /doc.html {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
