# ===== 传输优化 =====
# 静态资源已由 vite 构建期生成 .gz（VITE_COMPRESS=gzip），优先直接复用，省 CPU
gzip on;
gzip_static on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_vary on;
gzip_proxied expired no-cache no-store private auth;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    text/javascript
    application/xml+rss
    application/manifest+json
    image/svg+xml;

# 说明：sendfile / keepalive_timeout 已在基础镜像的 /etc/nginx/nginx.conf（http 层）设置，
# 本站点配置是被 http{} include 进来的，重复声明会直接启动失败（"sendfile directive is duplicate"）。
# 这里只保留基础镜像没有的优化项。
tcp_nopush on;
tcp_nodelay on;
# 附件/视频上传：默认 1m 容易 413，放宽到 200m
client_max_body_size 200m;

server {
    listen 80;
    server_name _;

    # Docker 内置 DNS，每次请求动态解析 gateway 域名（valid=10s），
    # 避免网关容器重启换 IP 后，nginx 缓存旧 IP 导致接口 502/401
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容 hash 的构建产物（js/jse/css/mjs/字体/图片/图标集合等）：长期强缓存。
    # 文件名随内容变化，可安全 immutable，二次访问不再回源。
    location ~* ^/(js|jse|css|mjs|static|tinymce|iconify|png|svg|woff|woff2|ttf|eot|mp3)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 前端使用 hash 路由，/auth/register 这类不带 # 的直达链接会落到 index.html
    # 并被默认路由带回登录页；这里直接重定向到带 hash 的注册页，避免用户以为注册入口失效。
    location = /auth/register {
        # 使用 $http_host 保留端口（直接用 / 开头的相对地址时 nginx 会拼成不带端口的绝对地址）
        return 302 $scheme://$http_host/#/auth/register;
    }

    # 云培训学院-考试与认证（独立服务 module5-training-exam，可选）
    # 使用变量延迟解析：未部署该服务时 nginx 也能正常启动
    location /training-exam/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $exam_upstream http://training-exam:8000;
        rewrite ^/training-exam/(.*)$ /$1 break;
        proxy_pass $exam_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header tenant-id $http_tenant_id;
        proxy_read_timeout 60s;
    }

    # 云培训学院-直播（SRS 媒体，鉴权后转发）
    location /live-media/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $srs_upstream http://live-srs:8080;
        auth_request /_live_authorize;
        rewrite ^/live-media/(.*)$ /$1 break;
        proxy_pass $srs_upstream;
        add_header Cache-Control "private, no-store";
    }
    location = /_live_authorize {
        internal;
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream/admin-api/training/live-media/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location /admin-api/ {
        # SSE / 流式接口不做压缩，避免 gzip 缓冲导致 token 迟迟不到前端
        gzip off;
        # 使用变量形式的 proxy_pass，让 nginx 每次请求都重新解析 gateway 的 IP
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ===== [SSE] AI 智能助手流式输出支持 =====
        # 该 location 承载 /admin-api/ai/chat/message/send-stream 等 SSE 接口：
        # 1) 关闭代理缓冲，让后端逐帧输出立即透传给浏览器，避免前端迟迟收不到 token；
        # 2) 不做缓存，绝不改写后端返回的 Content-Type: text/event-stream；
        # 3) 流式连接需要保持更久，读超时放宽到 1 小时（对应对话期间的空闲）。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /app-api/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /infra/ws {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jmreport/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /drag/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jimubi/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sse {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /doc.html {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
