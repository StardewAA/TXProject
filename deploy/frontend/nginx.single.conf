# ============================================================================
# single（单体）模式部署专用：前端 Nginx 直接反代单体后端 txgy-server，
# 中间没有 gateway 那一跳。
#
# 与 gateway 模式（deploy/frontend/nginx.conf）的唯一区别：
#   上游由 $gateway_upstream → http://gateway:48080
#   改为 $server_upstream  → http://server:48080
#
# 【重要】上游一律使用「变量 + resolver 动态解析」写法：
#   若写成硬编码 proxy_pass http://server:48080; ，nginx 只会在“启动时”
#   解析一次并永久缓存该 IP。后端容器一旦重建（IP 变化），nginx 仍往旧 IP
#   转发 → 全站 502，必须重启 nginx 才能恢复。
#   改成变量写法后，nginx 按 resolver 的 valid=10s 重新解析 DNS，
#   后端重建后无需重启 nginx 即可自动恢复。
#
# 【重要】变量值末尾不要带 "/"：
#   set $server_upstream http://server:48080;    ← 正确，原样透传 /admin-api/xxx
#   set $server_upstream http://server:48080/;   ← 错误，会吃掉 /admin-api/ 前缀导致 404
# ============================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 4g;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    # Docker 内嵌 DNS：动态解析上游，避免容器重启换 IP 后 nginx 缓存旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $server_upstream http://server:48080;

    # 转发客户端租户头（前端通过请求头 tenant-id 传递；为空时不发送）
    set $final_tenant_id $http_tenant_id;

    # 前端未携带租户头时使用默认租户 1；显式传入的租户编号保持不变。
    set $resolved_tenant_id $http_tenant_id;
    if ($resolved_tenant_id = "") {
        set $resolved_tenant_id 1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /admin-api/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;            # SSE (AI send-stream) needs unbuffered responses
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header tenant-id $resolved_tenant_id;
    }

    location /app-api/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header tenant-id $resolved_tenant_id;
    }

    location /admin/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 云培训学院-考试与认证（独立服务，可选）
    # 使用变量延迟解析：未部署该服务时 nginx 也能正常启动
    location /training-exam/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $exam_upstream http://training-exam:8000;
        rewrite ^/training-exam/(.*)$ /$1 break;
        proxy_pass $exam_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header tenant-id $http_tenant_id;
        proxy_read_timeout 60s;
    }

    # 云培训学院-直播（SRS 媒体，鉴权后转发）
    # live-srs 是可选服务，同样使用变量延迟解析，避免未启动时 nginx 启动失败
    location /live-media/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $srs_upstream http://live-srs:8080;
        auth_request /_live_authorize;
        rewrite ^/live-media/(.*)$ /$1 break;
        proxy_pass $srs_upstream;
        add_header Cache-Control "private, no-store";
    }
    location = /_live_authorize {
        internal;
        # single 模式没有独立 training 服务，鉴权接口由单体后端 txgy-server 提供
        resolver 127.0.0.11 valid=30s ipv6=off;
        proxy_pass $server_upstream/admin-api/training/live-media/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location /infra/ws {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jmreport/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /drag/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jimubi/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sse {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /doc.html {
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
