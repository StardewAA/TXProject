# 独立的本机开发配置。不要覆盖现有 deploy/docker-compose.yml 中的缓存 Redis。
# 当前只提供模板；本次未启动容器，也未创建数据卷。
name: txgy-cms-search

services:
  redis-search:
    image: ${CMS_REDIS_SEARCH_IMAGE:-redis:8.2}
    profiles: ["search"]
    ports:
      - "127.0.0.1:${CMS_REDIS_SEARCH_PORT:-6380}:6379"
    volumes:
      - cms-search-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw COMMAND INFO FT.SEARCH | grep -qi '^ft.search$'"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cms-search-data:
