# 本地编排主入口：中间件（MySQL / Redis / Nacos）+ 本地业务服务。
# 构建职责分离：先由 deploy/local/build.ps1 生成 jar，再由 Dockerfile.runtime
# 构建纯运行时镜像；前端由宿主机生成 dist，再由 Dockerfile.host-dist 打包。
#   2. MySQL 不挂载 deploy/mysql/init：该目录下 0068/0069 是 mysqldump --all-databases 全实例导出，
#      含 DROP TABLE mysql.columns_priv 等系统表重建语句，自动导入会破坏容器系统库。改为受控手动导入
#      （见 init-db.ps1），只导入业务 SQL 到 ruoyi-vue-pro。
#   3. 为适配本机 Docker 约 7.4GB 内存上限，各服务设置 mem_limit 与 JVM -Xmx
# 启动示例：
#   docker compose -f deploy/local/docker-compose.local.yml --env-file deploy/.env up -d mysql redis nacos
#   docker compose -f deploy/local/docker-compose.local.yml --env-file deploy/.env up -d gateway system

x-txgy-service: &txgy-service
  build:
    context: .
    dockerfile: Dockerfile.runtime
  environment: &txgy-env
    TZ: ${TZ:-Asia/Shanghai}
    SERVER_PORT: 48080
    SPRING_PROFILES_ACTIVE: local
    SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
    SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    # Nacos 3.0.3 runs with auth disabled (no default user), so no credentials are sent.
    # Nacos 3.0.3 ships with no default user and its v3 admin API cannot create a
    # namespace, so the "dev" namespace (declared in application-local.yaml) cannot be
    # provisioned here. Empty value -> built-in public namespace.
    SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: ""
    SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: ""
    SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
    SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
    SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
  depends_on:
    nacos:
      condition: service_healthy
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - txgy-dev
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    container_name: txgy-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - txgy-dev
    restart: unless-stopped
    mem_limit: 1200m

  redis:
    image: redis:7-alpine
    container_name: txgy-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - txgy-dev
    restart: unless-stopped
    mem_limit: 300m

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: txgy-nacos
    environment:
      MODE: standalone
      # local dev only: Nacos 3.0 ships without a default user and its v3 admin API
      # rejects the classic nacos/nacos login, so auth is disabled for this stack.
      # NACOS_AUTH_TOKEN must still be present: the entrypoint exits when it is empty.
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      TZ: ${TZ}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_TLS_PORT:-9849}:9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - txgy-dev
    restart: unless-stopped
    mem_limit: 1200m

  gateway:
    <<: *txgy-service
    container_name: txgy-gateway
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/gateway.jar
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
    ports:
      - "${GATEWAY_PORT:-48080}:48080"
      # 48081 是给「前端 dev 代理直连」用的：apps/web-antd/vite.config.ts 里
      # /admin-api/system、/admin-api/infra 被改写为 http://127.0.0.1:48081/admin-api
      # （同事按「宿主机 JVM 跑 system/infra」的方式配置的）。本机是容器栈、没有这两个
      # 宿主 JVM，若不映射该端口，登录/租户/菜单等 /admin-api/system/** 请求会 502。
      # 这里把 48081 也指向网关：网关本身就按 /admin-api/** 前缀路由，system 与 infra
      # 都能正确转发，无需改动仓库里共享的 vite.config.ts。
      - "127.0.0.1:48081:48080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      system:
        condition: service_healthy
      infra:
        condition: service_healthy
      bpm:
        condition: service_healthy
      hrm:
        condition: service_healthy
    mem_limit: 800m

  system:
    <<: *txgy-service
    container_name: txgy-system
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/system.jar
    # jar 以只读卷挂载，更新代码只需替换 deploy/local/jars/system.jar 再重启容器；
    # 否则每次重建镜像都要把 deploy/local 下近 1GB 的 jars 作为构建上下文传一遍（实测极慢）。
    volumes:
      - ./jars/system.jar:/app/app.jar:ro
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms384m -Xmx640m -XX:+UseG1GC
      # XXL-Job 执行器：token 清理、demo 任务
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://txgy-xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_APPNAME: system-server
      XXL_JOB_EXECUTOR_PORT: "9999"
      XXL_JOB_EXECUTOR_LOGPATH: /tmp/xxl-job-logs
    mem_limit: 950m

  infra:
    <<: *txgy-service
    container_name: txgy-infra
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/infra.jar
    # 同上：jar 走只读卷挂载，避免重建镜像时传大体积构建上下文
    volumes:
      - ./jars/infra.jar:/app/app.jar:ro
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
      # XXL-Job 执行器：访问日志/错误日志清理
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://txgy-xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_APPNAME: infra-server
      XXL_JOB_EXECUTOR_PORT: "9999"
      XXL_JOB_EXECUTOR_LOGPATH: /tmp/xxl-job-logs
    mem_limit: 800m

  bpm:
    <<: *txgy-service
    container_name: txgy-bpm
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/bpm.jar
    environment:
      <<: *txgy-env
      # 本地表结构已手工初始化（ACT_* 全套 + schema.version=8.0.0.0），
      # application.yaml 的 database-schema-update: false 因 Nacos import 的处理顺序会覆盖 profile 文件，
      # 环境变量的 relaxed binding 在 Spring Boot 4 下又无法映射中划线属性，
      # 因此用 JVM 系统属性（-D，kebab-case 精确匹配，优先级最高）显式声明
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC -Dflowable.database-schema-update=false
    mem_limit: 800m

  hrm:
    <<: *txgy-service
    container_name: txgy-hrm
    image: ${HRM_IMAGE:-local-hrm:latest}
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/hrm.jar
    # jar 以只读卷挂载，不再依赖镜像里烘焙的副本：
    # 更新 HRM 代码只需替换 deploy/local/jars/hrm.jar 再重启本容器即可。
    # 原因：本机 Docker 构建上下文传输实测仅约 0.1MB/s，而 deploy/local 目录含约 1.2GB
    # 的 jars，重建一次镜像需要数小时。镜像仅承担基础运行时（JRE + 启动脚本）职责。
    volumes:
      - ./jars/hrm.jar:/app/app.jar:ro
      # Offer 录用通知书 PDF 需要中文字体（PDFBox 内嵌字体，否则汉字会空白）
      # 字体文件放在 deploy/local/fonts/ 下（如 simhei.ttf），生产环境请换成开源字体（如 Noto Sans SC）
      - ./fonts:/app/fonts:ro
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx640m -XX:+UseG1GC
      # 启用 XXL-JOB 执行器（application-local.yaml 默认 xxl.job.enabled=false，
      # 此处用环境变量覆盖开启；调度中心地址指向同网络的 txgy-xxl-job-admin 容器，
      # 容器内 127.0.0.1:9090 指向容器自身，不可用）。
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://txgy-xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_APPNAME: hrm-server
      XXL_JOB_EXECUTOR_PORT: "9999"
      XXL_JOB_EXECUTOR_LOGPATH: /tmp/xxl-job-logs
      # HRM 招聘 Agent 模型配置：密钥从 deploy/.env 注入，不写入镜像或源码。
      HRM_AGENT_MODEL_ENABLED: ${HRM_AGENT_MODEL_ENABLED:-false}
      HRM_AGENT_MODEL_BASE_URL: ${HRM_AGENT_MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      HRM_AGENT_MODEL_NAME: ${HRM_AGENT_MODEL_NAME:-qwen-flash}
      HRM_AGENT_MODEL_API_KEY: ${HRM_AGENT_MODEL_API_KEY:-}
      HRM_AGENT_MODEL_TIMEOUT_MS: ${HRM_AGENT_MODEL_TIMEOUT_MS:-60000}
      HRM_AGENT_MODEL_MAX_TOKENS: ${HRM_AGENT_MODEL_MAX_TOKENS:-4096}
      HRM_AGENT_MODEL_TEMPERATURE: ${HRM_AGENT_MODEL_TEMPERATURE:-0.2}
      HRM_AGENT_MODEL_JSON_MODE: ${HRM_AGENT_MODEL_JSON_MODE:-true}
      HRM_AGENT_MODEL_EXTRA_BODY: ${HRM_AGENT_MODEL_EXTRA_BODY:-}
    mem_limit: 950m

  im:
    <<: *txgy-service
    container_name: txgy-im
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/im.jar
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
      # XXL-Job 执行器：RTC 通话清理
      XXL_JOB_ENABLED: "true"
      XXL_JOB_ADMIN_ADDRESSES: http://txgy-xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_EXECUTOR_APPNAME: im-server
      XXL_JOB_EXECUTOR_PORT: "9999"
      XXL_JOB_EXECUTOR_LOGPATH: /tmp/xxl-job-logs
    mem_limit: 800m

  member:
    <<: *txgy-service
    container_name: txgy-member
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/member.jar
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx448m -XX:+UseG1GC
    mem_limit: 700m

  crm:
    <<: *txgy-service
    container_name: txgy-crm
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/crm.jar
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
      # CRM AI 助手（意图识别）在后端调用千问，密钥从 .env 注入，不进代码仓库
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # 「从 WMS 同步」走本地直读同库 WMS 表，无需 WMS 只读令牌。
      # 注意：application.yaml 里 txgy.* 段声明在 spring.config.import 之后，
      # 处理顺序晚于 profile 文件，会覆盖 application-local.yaml 的 mode=mock，
      # 因此这里用环境变量（优先级最高）显式指定，否则会走 remote 模式并报
      # 「txgy.integration.wms.crm-product.authorization 未配置」。
      CRM_WMS_PRODUCT_MODE: mock
    mem_limit: 850m

  # WMS：CRM 进仓产品同步的数据来源，前端库存统计等页面依赖它，缺失时网关会报
  # 「Unable to find instance for wms-server」。
  wms:
    <<: *txgy-service
    container_name: txgy-wms
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/wms.jar
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    mem_limit: 850m

  ai:
    <<: *txgy-service
    container_name: txgy-ai
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: jars/ai.jar
    environment:
      <<: *txgy-env
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
    mem_limit: 850m

  # 管理后台前端（vben dist）静态托管 + /admin-api 反向代理到网关。
  # nginx 使用 resolver + 变量实现动态 DNS 解析：业务容器重建后 IP 变化时不会复用旧地址
  # （静态解析的旧 IP 若被其它容器复用，请求会绕过网关，接口返回 401「账号未登录」）。
  ui:
    image: nginx:1.27-alpine
    container_name: txgy-ui-nginx
    ports:
      - "8080:80"
    volumes:
      - ../../txgy-ui-admin-vben/apps/web-antd/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - txgy-dev
    restart: unless-stopped
    mem_limit: 128m
  frontend:
    container_name: txgy-frontend
    image: ${FRONTEND_IMAGE:-local-frontend:latest}
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile.host-dist
    depends_on:
      gateway:
        condition: service_healthy
    extra_hosts:
      - "live-srs:127.0.0.1"
      - "training:127.0.0.1"
      - "training-exam:127.0.0.1"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - txgy-dev
    restart: unless-stopped
    mem_limit: 256m

  # XXL-JOB 调度中心：承载 HRM 证件预警等定时任务的调度端。
  # 独立第三方组件，不走 txgy-service 锚点（无构建、无 Nacos/动态数据源依赖）。
  # 与 hrm 服务的环境变量 XXL_JOB_ADMIN_ADDRESSES（http://txgy-xxl-job-admin:8080/xxl-job-admin）
  # 及 accessToken（default_token，见 txgy-module-hrm application.yaml）对应。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: txgy-xxl-job-admin
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_OPTS: -Xms128m -Xmx384m
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --xxl.job.accessToken=default_token
    ports:
      - "127.0.0.1:${XXL_JOB_ADMIN_PORT:-9090}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - txgy-dev
    restart: unless-stopped
    mem_limit: 512m

volumes:
  mysql-data:
  nacos-data:

networks:
  txgy-dev:
    name: txgy-dev
