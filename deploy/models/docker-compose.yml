# =============================================================================
# 标书 Agent · 私有化模型服务编排（对应《标书Agent_最终架构设计》第 6 章）
#
# 组件：
#   - qdrant        向量库（单机验证档）
#   - tei-embedding TEI 跑 bge-m3（Embedding，端口 8081）
#   - tei-reranker  TEI 跑 bge-reranker-v2-m3（Rerank，端口 8082）
#   - vllm          vLLM 跑 Qwen2.5（OpenAI 兼容接口，端口 8100）
#
# 启动：docker compose -f deploy/models/docker-compose.yml up -d
# 注意：vLLM 需要 NVIDIA GPU；TEI 的两个容器可用 CPU（验证档）或 GPU。
# =============================================================================
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: txgy-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"

  tei-embedding:
    # bge-m3 相对较小，CPU 可跑；GPU 场景换成 text-embeddings-inference:1.5 并加 gpus
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: txgy-tei-embedding
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./hf-models:/data
    command:
      - --model-id
      - BAAI/bge-m3
      - --port
      - "80"

  tei-reranker:
    # rerank 精度提升最大，约 1.2GB 显存；bge-reranker-v2-m3 由 TEI 自动识别为 rerank 模型
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: txgy-tei-reranker
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./hf-models:/data
    command:
      - --model-id
      - BAAI/bge-reranker-v2-m3
      - --port
      - "80"

  vllm:
    # Qwen2.5-14B-AWQ ≈10GB 显存；生产档可换 Qwen2.5-32B-AWQ ≈20GB
    image: vllm/vllm-openai:latest
    container_name: txgy-vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "8100:8000"
    volumes:
      - ./hf-models:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-AWQ}
      - --served-model-name
      - Qwen2.5-14B-Instruct-AWQ
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.90"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_storage:
