services:
  mysql:
    image: mysql:8.4
    ports: !override
      - "13306:3306"

  redis:
    image: redis:7-alpine
    ports: !override
      - "16379:6379"

  nacos:
    image: docker.m.daocloud.io/nacos/nacos-server:v3.0.3

  gateway:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile.local
    ports: !override
      - "58080:48080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      system:
        condition: service_healthy
      infra:
        condition: service_healthy
      hrm:
        condition: service_healthy
      bpm:
        condition: service_healthy
      erp:
        condition: service_healthy

  system:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  infra:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  member:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  bpm:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  pay:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  report:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  mp:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  product:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  trade:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  promotion:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  statistics:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  crm:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  erp:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  iot:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  iot-gateway:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  mes:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  wms:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  im:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  ai:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  hrm:
    build:
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-hrm/txgy-module-hrm-server

  fms:
    build:
      dockerfile: deploy/backend/Dockerfile.local

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
