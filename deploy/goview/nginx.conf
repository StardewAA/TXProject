# GoView 大屏设计器站点配置（容器内 Nginx）
# 静态资源来自构建产物 dist；所有后端请求 /admin-api 反代到 txgy-dev 网络里的 gateway:48080。

gzip on;
gzip_static on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_vary on;
gzip_proxied expired no-cache no-store private auth;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    text/javascript
    application/xml+rss
    application/manifest+json
    image/svg+xml;

tcp_nopush on;
tcp_nodelay on;
# 大屏里可能通过 /admin-api/infra/file/upload 上传图片/视频素材，放宽请求体上限
client_max_body_size 200m;

server {
    listen 80;
    server_name _;

    # gateway 容器重启换 IP 后不需要重启本容器：每次请求重新解析（valid=10s）
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容 hash 的构建产物：长期强缓存
    location ~* ^/(js|jse|css|mjs|static|tinymce|iconify|png|svg|woff|woff2|ttf|eot|mp3)/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 单页应用（hash 路由）：未命中文件一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 后端接口：登录、租户、用户信息、大屏项目 CRUD、文件上传……
    location /admin-api/ {
        gzip off;
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大屏预览/数据接口可能较慢，放宽读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 预留：移动端/前台接口（如果后续大屏要直接调 app-api）
    location /app-api/ {
        set $gateway_upstream http://gateway:48080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
