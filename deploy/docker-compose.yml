

# 后端服务公共环境变量单独一个锚点。
# 【重要】compose 里 `environment` 是整体替换、不是深合并：服务块只要自己写了
# environment，就完全丢掉锚点里的环境（DB/Nacos/Redis 地址全没了，容器会退回连
# 127.0.0.1 并疯狂重启）。因此服务块必须写成：
#     environment:
#       <<: *backend-env      # 先并入公共变量
#       JAVA_OPTS: ...        # 再覆盖/追加自己的
x-backend-env: &backend-env
  SERVER_PORT: 48080
  TZ: ${TZ}
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
  SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  # 资源中心本地文件上传根目录（training 服务使用，绝对路径落于卷 /app/uploads）
  RESOURCE_UPLOAD_DIR: /app/uploads
  # 关闭登录行为验证码，便于本地联调；生产环境请移除或置 true
  TXGY_CAPTCHA_ENABLE: "false"

# 后端服务公共锚点：只放依赖/健康检查/网络；env 走上面的 *backend-env。



x-backend-service: &backend-service
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    nacos:
      condition: service_healthy
  environment:
    TZ: ${TZ}
    SERVER_PORT: 48080
    SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
    SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
    SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
    SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    SPRING_DATA_REDIS_HOST: redis
    # 资源中心本地文件上传根目录（training 服务使用，绝对路径落于卷 /app/uploads）
    RESOURCE_UPLOAD_DIR: /app/uploads
    TXGY_CAPTCHA_ENABLE: "false" # 关闭登录行为验证码，便于本地联调；生产环境请移除或置 true
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:$${SERVER_PORT}/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 90s
  networks:
    - txgy-dev
  restart: unless-stopped
  # 容器日志轮转：docker logs 仅保留最近 3×50MB，防止 dev-web-antd.log 这类文件无限增长
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: ${TZ}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - txgy-dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - txgy-dev

  nacos:
    image: nacos/nacos-server:v3.0.3
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      NACOS_SERVER_IP: 127.0.0.1
      TZ: ${TZ}
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 3072m # 内存上限，防止 Nacos 被宿主机 OOM 误杀（历史上被 SIGKILL 137 反复杀掉）
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - txgy-dev

  gateway:
    <<: *backend-service
    build:
      context: ./jars/gateway
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: app.jar
    environment:
      <<: *backend-env
      JAVA_OPTS: -Xms96m -Xmx320m -XX:MaxMetaspaceSize=224m -XX:+UseG1GC -XX:MaxRAMPercentage=32
    ports:
      - "48080:48080"

  system:
    <<: *backend-service
    build:
      context: ./jars/system
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: app.jar
    environment:
      <<: *backend-env
      JAVA_OPTS: -Xms96m -Xmx448m -XX:MaxMetaspaceSize=320m -XX:+UseG1GC -XX:MaxRAMPercentage=45

  infra:
    <<: *backend-service
    build:
      context: ./jars/infra
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: app.jar
    environment:
      <<: *backend-env
      JAVA_OPTS: -Xms96m -Xmx448m -XX:MaxMetaspaceSize=320m -XX:+UseG1GC -XX:MaxRAMPercentage=45

  member:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-member/txgy-module-member-server

  bpm:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-bpm/txgy-module-bpm-server

  pay:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-pay/txgy-module-pay-server

  report:
    <<: *backend-service
    build:
      context: ./jars/report
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: app.jar
    environment:
      <<: *backend-env
      JAVA_OPTS: -Xms96m -Xmx384m -XX:MaxMetaspaceSize=288m -XX:+UseG1GC -XX:MaxRAMPercentage=38

  mp:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-mp/txgy-module-mp-server

  product:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-mall/txgy-module-product-server

  trade:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-mall/txgy-module-trade-server

  promotion:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-mall/txgy-module-promotion-server

  statistics:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-mall/txgy-module-statistics-server

  crm:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-crm/txgy-module-crm-server

  erp:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-erp/txgy-module-erp-server

  iot:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-iot/txgy-module-iot-server

  iot-gateway:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-iot/txgy-module-iot-gateway

  # mes-server：注册服务名由 jar 内 application.yaml 的 spring.application.name=mes-server 决定
  # （网关路由 lb://mes-server，必须严格一致）；继承 x-backend-service 的 depends_on（mysql/redis/nacos
  # 均须 service_healthy 后才启动），因此 Nacos 未就绪时 mes 不会被拉起，避免历史报错
  # "Unable to resolve host nacos / Unable to find instance for mes-server" 复现。
  mes:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-mes/txgy-module-mes-server
    mem_limit: 2048m # 与 slim 覆盖的 JAVA_OPTS -Xmx1024m 配套，单容器限高，防止拖垮整个 Docker VM

  wms:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-wms/txgy-module-wms-server

  im:
    <<: *backend-service
    build:
      context: ./jars/im
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: app.jar
    environment:
      <<: *backend-env
      JAVA_OPTS: -Xms96m -Xmx384m -XX:MaxMetaspaceSize=288m -XX:+UseG1GC -XX:MaxRAMPercentage=38

  ai:
    <<: *backend-service
    build:
      context: ./jars/ai
      dockerfile: Dockerfile.runtime
      args:
        JAR_FILE: app.jar
    # ai 的 jar 最大（419MB），构建器与向量库相关类较多，元空间给宽一些
    environment:
      <<: *backend-env
      JAVA_OPTS: -Xms96m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -XX:MaxRAMPercentage=51

  hrm:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-hrm/txgy-module-hrm-server

  fms:
    <<: *backend-service
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
      args:
        MODULE_PATH: txgy-module-fms/txgy-module-fms-server

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - txgy-dev
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  nacos-data:

networks:
  txgy-dev:
    name: txgy-dev
